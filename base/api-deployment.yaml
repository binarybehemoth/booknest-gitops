apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: booknest, tier: api }
  annotations: { kubernetes.io/change-cause: "BookNest API 1.4, settings from api-config" }
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 60
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: booknest, tier: api } }
  template:
    metadata: { labels: { app: booknest, tier: api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000 }
      containers:
      - name: api
        image: localhost:33500/booknest-api:1.4
        ports: [{ name: http, containerPort: 3000 }]
        envFrom: [{ configMapRef: { name: api-config } }]
        env:
        - name: PGUSER
          valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
        - { name: PGPASSWORD_FILE, value: /run/secrets/db/password }
        volumeMounts: [{ name: db-credentials, mountPath: /run/secrets/db, readOnly: true }]
        startupProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 2
          failureThreshold: 30   # up to 60 s to connect, create the schema and listen
        readinessProbe:
          httpGet: { path: /ready, port: http }
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe: { httpGet: { path: /health, port: http }, timeoutSeconds: 3 }
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
        securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
      volumes:
      - { name: db-credentials, secret: { secretName: db-credentials, defaultMode: 0440 } }
