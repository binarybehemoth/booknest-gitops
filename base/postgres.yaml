apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app: booknest, tier: db } }
spec:
  clusterIP: None
  selector: { app: booknest, tier: db }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, labels: { app: booknest, tier: db } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: booknest, tier: db } }
  template:
    metadata: { labels: { app: booknest, tier: db } }
    spec:
      containers:
      - name: postgres
        image: localhost:33500/postgres:18
        env:
        - { name: POSTGRES_DB, value: booknest }
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
        - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db/password }
        ports: [{ name: postgres, containerPort: 5432 }]
        resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 256Mi } }
        readinessProbe:
          exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d booknest'] }
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql }
        - { name: db-credentials, mountPath: /run/secrets/db, readOnly: true }
      volumes: [{ name: db-credentials, secret: { secretName: db-credentials } }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      storageClassName: booknest-data
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 1Gi } }
