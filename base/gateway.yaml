apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: booknest, labels: { app: booknest } }
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - { name: http, protocol: HTTP, port: 80, hostname: books.example.com }
  - name: https
    protocol: HTTPS
    port: 443
    hostname: books.example.com
    tls: { mode: Terminate, certificateRefs: [{ name: books-tls }] }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: booknest, labels: { app: booknest } }
spec:
  parentRefs: [{ name: booknest }]
  hostnames: [books.example.com]
  rules:
  - matches:
    - path: { type: PathPrefix, value: /api }
    - path: { type: Exact, value: /version }
    backendRefs: [{ name: api, port: 3000 }]
  - backendRefs: [{ name: web, port: 80 }]
