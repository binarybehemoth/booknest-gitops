apiVersion: apps/v1
kind: Deployment
metadata: { name: web, labels: { app: booknest, tier: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: booknest, tier: web } }
  template:
    metadata: { labels: { app: booknest, tier: web } }
    spec:
      containers:
      - name: nginx
        image: localhost:33500/booknest-web:1.3
        env: [{ name: API_UPSTREAM, value: "api.booknest.svc.cluster.local:3000" }]
        ports: [{ name: http, containerPort: 80 }]
        resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: web, labels: { app: booknest, tier: web } }
spec:
  selector: { app: booknest, tier: web }
  ports: [{ name: http, port: 80, targetPort: http }]
