apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: booknest, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/binarybehemoth/booknest-gitops.git
    targetRevision: main
    path: production
  destination: { server: https://kubernetes.default.svc, namespace: booknest }
  syncPolicy:
    automated: { prune: true, selfHeal: true }   # apply commits, delete removed objects, undo drift
